[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undertheinfluence"
version = "3.0.0"
description = "Track political influence in the UK through lobbying and donations data"
requires-python = ">=3.12"

# ===========================
# Black - Code Formatter
# ===========================
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations  # Don't format migration files
)/
'''

# ===========================
# Ruff - Fast Linter
# ===========================
[tool.ruff]
line-length = 100
target-version = "py312"

# Exclude directories
extend-exclude = [
    "migrations",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by black)
    "DJ001",  # Django model without __str__ (not always needed)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use assertions and relative imports
"test_*.py" = ["S101", "F401"]
"tests/**/*.py" = ["S101", "F401"]
# Settings can have wildcard imports
"*/settings.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["datafetch", "api", "cms", "appc_redirect", "undertheinfluence"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# ===========================
# Mypy - Type Checker
# ===========================
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

# Exclude directories
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "polymorphic.*",
    "modelcluster.*",
    "taggit.*",
    "wagtail.*",
    "compressor.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "undertheinfluence.settings"

# ===========================
# Pytest - Testing
# ===========================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "undertheinfluence.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=datafetch",
    "--cov=api",
    "--cov=cms",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--no-cov-on-fail",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ===========================
# Coverage
# ===========================
[tool.coverage.run]
source = ["datafetch", "api", "cms"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
