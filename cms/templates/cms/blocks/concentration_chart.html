{% load static %}

<div class="data-block my-4">
    {% if value.title %}
    <h2 class="mb-3">{{ value.title }}</h2>
    {% endif %}

    <div data-island="ConcentrationChart">
        <!-- Server-rendered fallback -->
        <div class="card">
            <div class="card-body text-center">
                <strong>Loading Concentration Chart</strong>
                <p class="text-muted small mb-0">Preparing visualization...</p>
            </div>
        </div>
    </div>

    {% if value.description %}
    <div class="mt-3">
        <p class="text-muted">{{ value.description|linebreaks }}</p>
    </div>
    {% endif %}
</div>
