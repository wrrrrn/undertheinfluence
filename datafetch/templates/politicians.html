{% extends "base.html" %}
{% load static %}

{% block title %}Politicians Directory - UnderTheInfluence{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-4 fw-bold">Politicians</h1>
            <p class="lead text-muted">Browse and search UK Members of Parliament, Peers, and Ministers.</p>
        </div>
    </div>

    <!-- React Island: PoliticianDirectory -->
    <!-- This will hydrate into the full interactive directory -->
    <div id="politician-directory-island"
         data-island="PoliticianDirectory"
         data-api-base="/api/v2/">
        
        <!-- Server-rendered fallback / Loading state -->
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card bg-light border-0">
                    <div class="card-body">
                        <div class="placeholder-glow">
                            <span class="placeholder col-7"></span>
                            <span class="placeholder col-4"></span>
                            <span class="placeholder col-4"></span>
                            <span class="placeholder col-6"></span>
                            <span class="placeholder col-8"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    {% for i in "123456" %}
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="card-body text-center p-4">
                                <div class="placeholder-glow">
                                    <div class="ratio ratio-1x1 rounded-circle bg-secondary bg-opacity-10 mx-auto mb-3" style="width: 80px;"></div>
                                    <span class="placeholder col-6 mb-2"></span>
                                    <span class="placeholder col-4"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
